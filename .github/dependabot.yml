version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # polars is a large dependency — update manually with a full test run
      - dependency-name: polars
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: polars-ops
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # bincode only writes the sheet stack's own swap files (src/data/swap.rs); 2.x is a
      # new API and as unmaintained as 1.x (RUSTSEC-2025-0141). Replacing it is its own task.
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
