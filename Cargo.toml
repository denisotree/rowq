[package]
name = "rowq"
version = "1.0.0"
edition = "2021"
authors = ["denisotree"]
description = "Query rows in tables, documents and databases from the terminal — CSV, JSON, YAML, TOML, Parquet, Excel, SQLite, DuckDB — with an MCP server that lets AI assistants compute over the same files"
license = "Apache-2.0"
repository = "https://github.com/denisotree/rowq"
homepage = "https://rowq.dev"
documentation = "https://docs.rs/rowq"
readme = "README.md"
keywords = ["tui", "data", "mcp", "csv", "sqlite"]
categories = ["command-line-utilities", "visualization"]
exclude = [
    "packaging/",
    ".github/",
    "docs/",
    ".githooks/",
    ".claude/",
]

[features]
default = ["bundled-duckdb"]
bundled-duckdb = ["duckdb/bundled"]

[[bin]]
name = "rowq"
path = "src/main.rs"

# The MCP server alone. On Windows it opens no console window: see the file.
[[bin]]
name = "rowq-mcp"
path = "src/bin/rowq-mcp.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
color-eyre = "0.6"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
bincode = "1"
arboard = { version = "3", default-features = false }
polars = { version = "0.55", default-features = false, features = ["csv", "lazy", "dtype-date", "dtype-datetime", "strings", "parquet", "ipc", "serde", "pivot", "is_in", "regex", "rank", "cum_agg", "diagonal_concat", "semi_anti_join", "abs", "round_series", "log", "temporal", "extract_jsonpath", "dtype-struct", "dtype-decimal", "json", "streaming", "concat_str"] }
libc = "0.2"
# Physical memory for the default memory budget, on every platform. Already in the tree
# through polars-utils with these same features, so it adds nothing to the build.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
calamine = { version = "0.38", features = ["chrono"] }
glob = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
# Without duckdb's default features: its `download-lib` makes the build script fetch a
# pre-built libduckdb whenever DuckDB is not bundled, which fails without network (docs.rs)
# and, before pkg-config is even asked, overrides the system library a
# `--no-default-features` build is meant to link. pkg-config and vcpkg stay, through
# libduckdb-sys directly — duckdb itself forwards them only as part of its defaults.
duckdb = { version = "1", default-features = false }
libduckdb-sys = { version = "1.20000.1", default-features = false, features = ["pkg-config", "vcpkg"] }
rust_xlsxwriter = "0.102"
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
rand = "0.10"
serde_yaml_ng = "0.10.0"
indexmap = "2.14.0"
toml_edit = "0.25.13"
jaq-core = "3.1.0"
# NB: trimming jaq-std's features here has no effect — jaq-json depends on it with
# defaults, and feature unification wins.  jiff, base64 and urlencoding come along.
jaq-std = "3.0.1"
jaq-json = "2.0.1"
libm = "0.2"
rust_decimal = { version = "1.43", default-features = false, features = ["std", "maths"] }

# `.deb` built by cargo-deb in the release workflow and served from the APT
# repository at apt.rowq.dev.
[package.metadata.deb]
maintainer = "denisotree <denisotree@users.noreply.github.com>"
copyright = "2026, denisotree"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
A fast, keyboard-driven terminal viewer for tables, documents and databases,
with an MCP server that lets AI assistants compute over the same files. Reads
CSV, TSV, JSON, JSONL, YAML, TOML, Markdown, Parquet, Arrow, Excel, SQLite and
DuckDB. Filtering, sorting, pivot tables, joins, computed columns, statistics
and charts. JSON, YAML and TOML open as a table over the parsed document, so
nested data can be browsed, edited and converted between formats. rowq
continues tuitab, which stays at 0.11.2 and installs side by side with it."""
# Every entry is a table on purpose: dependabot's TOML library cannot re-emit an
# array that mixes arrays with tables, and dies on Cargo.toml before it can open
# an update PR.  Table form is what cargo-deb documents for symlinks anyway.
assets = [
    { source = "target/release/rowq", dest = "usr/bin/", mode = "755" },
    { source = "README.md", dest = "usr/share/doc/rowq/", mode = "644" },
]

[package.metadata.docs.rs]
# Build only for Linux x86_64. Without default features: compiling the bundled DuckDB
# from C++ needs more than docs.rs's 6 GB build limit (earlier builds, tuitab 0.11.1
# among them, were killed for memory), and documenting the crate links nothing, so the system
# library is never needed. SQLite stays bundled through rusqlite either way.
targets = ["x86_64-unknown-linux-gnu"]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

# The bundled DuckDB amalgamation compiles to ~280 .o files that are ~90% DWARF,
# 2.9 GB per build-dir hash — and cargo keeps a fresh copy on every version or
# feature change.  We never step through DuckDB's C++; drop its debug info.
[profile.dev.package.libduckdb-sys]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
# 17% of the binary is local symbols.  Dropping them costs symbol names in panic
# backtraces; the error chain color-eyre prints is unaffected, and packagers strip
# anyway.  Set to false when bisecting a crash.
strip = "symbols"

[dev-dependencies]
statrs = "0.19"
